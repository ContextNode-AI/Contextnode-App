name: Render Backend Keep-Alive

on:
  schedule:
    # Runs every 12 minutes to prevent Render free instance spin-down
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          TARGET_URL="${{ secrets.VERCEL_APP_URL || 'https://contextnode.in' }}/api/internal/render-keepalive"
          echo "Pinging internal keepalive route: $TARGET_URL"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$TARGET_URL" || true)
          
          echo "Internal route response status: $HTTP_STATUS"
          
          # Also ping backend API health directly as guaranteed fallback
          echo "Pinging backend health directly: https://api.contextnode.in/api/health"
          BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.contextnode.in/api/health" || true)
          echo "Backend health status: $BACKEND_STATUS"
