services:
  postgres:
    image: postgres:15-alpine
    container_name: contextnode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contextnode_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-contextnode}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - contextnode_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contextnode_user} -d ${POSTGRES_DB:-contextnode}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  contextnode_postgres_data:
    name: contextnode_postgres_data
